name: CI

# Runs the project's five gates on every push to main and every pull request
# targeting main, so a broken gate is caught before it lands rather than by
# whoever next happens to run it by hand (N-9 / DEC-007).

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "rfcs/**"
      - "LICENSE"
      - "NOTICE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "rfcs/**"
      - "LICENSE"
      - "NOTICE"

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Matches the toolchain the project's gates are pinned to.
  TOOLCHAIN: "1.91"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # git diff --check below needs the base commit's history, not just
          # the tip a shallow clone would give it.
          fetch-depth: 0

      # knotra is an iced/wgpu GUI application; --all-targets builds the
      # binary, so clippy needs the same Linux GUI deps release.yaml installs.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev

      # clippy and rustfmt are not in the minimal profile; without this the
      # job fails on the first gate step for a trivial reason.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component clippy,rustfmt

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ci-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ci-lint-

      - name: cargo fmt --all --check
        run: cargo "+$TOOLCHAIN" fmt --all --check

      - name: cargo clippy --workspace --all-targets -D warnings
        run: cargo "+$TOOLCHAIN" clippy --workspace --all-targets -- -D warnings

      # A bare `git diff --check` compares the working tree against the
      # index, which in a fresh CI checkout is always empty and passes
      # vacuously. Diff against the commit this push/PR actually introduced
      # instead, so a trailing-whitespace violation is caught for real.
      #
      # `github.event.before` is the null SHA only if `main` itself is being
      # created or recreated from nothing — this workflow triggers on
      # `push: branches: [main]`, so an ordinary new branch never reaches
      # this step at all, and a force-push sets `before` to the old tip, not
      # the null SHA (097 correcting 095 Finding 1). Reachable only in that
      # one edge case, but handled defensively: fall back to `HEAD~1` first
      # (always correct and always available under `fetch-depth: 0`), then
      # the merge-base with origin/main (meaningful only for a branch that
      # genuinely diverged — trying it first, as an earlier version of this
      # step did, resolves to HEAD itself on an ordinary push and passes
      # vacuously, exactly the failure this step exists to prevent — 097
      # Finding 1), then skip only if neither exists (a true root commit).
      - name: git diff --check (against the base of this push/PR)
        run: |
          NULL_SHA="0000000000000000000000000000000000000000"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "$NULL_SHA" ]; then
            if git rev-parse --verify -q HEAD~1 >/dev/null; then
              BASE="HEAD~1"
              echo "No prior commit for this ref; using HEAD~1: $BASE"
            elif git rev-parse --verify -q origin/main >/dev/null; then
              BASE="$(git merge-base origin/main HEAD)"
              echo "No HEAD~1; falling back to merge-base with origin/main: $BASE"
            else
              echo "No meaningful base to diff against (root commit); skipping."
              exit 0
            fi
          fi

          echo "Diffing ${BASE}..${{ github.sha }}"
          git diff --check "$BASE" "${{ github.sha }}"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ci-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ci-test-

      - name: cargo test -p knotra
        run: cargo "+$TOOLCHAIN" test -p knotra

      - name: cargo test -p knotra-ui
        run: cargo "+$TOOLCHAIN" test -p knotra-ui

      # knotra-vcs's own test harness builds every git Command with full
      # environment isolation (Handoff 012) — no external env needed here.
      - name: cargo test -p knotra-vcs
        run: cargo "+$TOOLCHAIN" test -p knotra-vcs
