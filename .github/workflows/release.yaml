name: Release

# Pushing a version tag produces the whole release: notes are extracted and
# advisories checked in parallel, every platform is built and archived, and
# only once all three have succeeded does `publish` create the GitHub
# Release with all three archives attached at once. A platform failure
# means no release is published at all, rather than a partial one missing
# a binary (RFC-060 D4).

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  # A dispatched run exercises notes, advisories, and build - producing
  # downloadable artifacts - and skips publish, so the whole flow can be
  # verified without creating a public release.
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  BIN_NAME: knotra
  # Matches the toolchain the project's gates are pinned to.
  TOOLCHAIN: "1.91"

jobs:
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The release notes are the CHANGELOG section for this exact version,
      # so the published notes and the changelog cannot drift apart. A tag
      # with no matching section fails here rather than publishing an empty
      # release - that strictness stays on a real push, unconditionally.
      #
      # On workflow_dispatch there is no tag to match, and GITHUB_REF_NAME is
      # just the branch name - using it here would extract nothing, so build
      # would never run and the dry run would verify nothing it exists to
      # verify (Review 201 F1). Instead, a dispatched run uses the newest
      # released `## [x.y.z]` section, so notes/build/upload all exercise
      # real content without needing a tag.
      - name: Extract release notes from CHANGELOG
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG=$(grep -m1 -E '^## \[[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed -E 's/^## \[([^]]+)\].*/\1/')
            if [ -z "$TAG" ]; then
              echo "::error::CHANGELOG.md has no released '## [x.y.z]' section for a dry run"
              exit 1
            fi
            echo "workflow_dispatch: using newest released section '$TAG' for a dry run"
          else
            TAG="$GITHUB_REF_NAME"
          fi

          awk -v tag="$TAG" '
            index($0, "## [" tag "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$TAG]' section"
            exit 1
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes.md

  advisories:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Mirrors advisories.yaml's own gate exactly: checkout, presence check,
      # toolchain, cargo-deny cache/install, scan (RFC-060 D2). Duplicated
      # rather than shared as a reusable workflow (RFC-060 non-goal) - Review
      # 201 F2 is what happens when only one copy is updated, so change both
      # together whenever either changes.
      - name: Check deny.toml declares every advisory class
        run: |
          missing=0
          for key in yanked unmaintained unsound unused-ignored-advisory; do
            grep -Eq "^[[:space:]]*${key}[[:space:]]*=" deny.toml || { echo "::error::deny.toml is missing [advisories] ${key}"; missing=1; }
          done
          [ "$missing" -eq 0 ]

      # The runner's default rustup toolchain is stable, and rustup does not
      # auto-install a toolchain named with `+`; without this, the scan step
      # below fails before it ever reaches cargo-deny.
      - name: Install Rust toolchain
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal

      - name: Cache cargo-deny
        id: cache-cargo-deny
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}

      - name: Install cargo-deny
        if: steps.cache-cargo-deny.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny --version 0.20.2

      - name: Check advisories
        run: cargo +1.91 deny --manifest-path Cargo.toml check advisories

  build:
    name: ${{ matrix.name }}
    needs: [notes, advisories]
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the others work.
      fail-fast: false
      matrix:
        include:
          - name: Linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_ext: ""
            archive_ext: .tar.gz
          - name: macOS-aarch64
            target: aarch64-apple-darwin
            os: macos-latest
            bin_ext: ""
            archive_ext: .zip
          - name: Windows-x64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_ext: .exe
            archive_ext: .zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # knotra is an iced/wgpu GUI application; on Linux it needs Wayland,
      # xkbcommon, and GL headers present at build time.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup target add ${{ matrix.target }} --toolchain "$TOOLCHAIN"

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-

      - name: Build release binary
        run: |
          cargo "+$TOOLCHAIN" build \
            --release \
            --locked \
            --target ${{ matrix.target }} \
            --bin "$BIN_NAME"

      # Files are staged flat and archived from inside `dist`, so they unpack
      # straight into the extraction destination with no intermediate parent
      # directory — the same rule the source tarball follows. LICENSE and
      # NOTICE ship with the binary, as Apache-2.0 section 4 requires.
      - name: Stage archive contents
        run: |
          ASSET="${BIN_NAME}@${{ matrix.name }}-${GITHUB_REF_NAME}${{ matrix.archive_ext }}"
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.bin_ext }}" dist/
          cp LICENSE NOTICE README.md dist/

      - name: Create archive (tar.gz)
        if: matrix.archive_ext == '.tar.gz'
        run: tar czf "${ASSET}" -C dist .

      - name: Create archive (zip)
        if: matrix.archive_ext == '.zip'
        run: |
          cd dist
          7z a "../${ASSET}" .

      # No release upload here — `publish` attaches all three archives at
      # once, only after every platform has built (RFC-060 D4).
      - name: Upload archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: ${{ env.ASSET }}

  # Recovery: a transient failure (a flaky runner, a network blip) is
  # cleared by re-running only the failed jobs from the Actions UI;
  # `publish` then proceeds against the same tag and the same build
  # outputs. A failure that needs a code fix needs a new tag — re-running
  # rebuilds the same commit, so it cannot pick up a fix that has not been
  # tagged yet. If `publish` itself fails after a fix is needed, the tag
  # already pushed points at a commit that will never produce a release —
  # delete that tag (`git push --delete origin <tag>` and locally) and push
  # a new one once the fix lands, rather than re-running or re-pushing the
  # same tag.
  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # A dispatched run (no tag) produces artifacts from notes/advisories/build
    # for inspection and stops here - it never creates a release. Only a real
    # tag push publishes.
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # This job has no `actions/checkout`, so `gh` has no git remote to read
      # the repository from — `GH_REPO` is what tells it instead (Review 202
      # F3). A checkout would also supply one, but cloning the repository
      # just to name it is the heavier fix.
      - name: Create the release with all archives attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file artifacts/release-notes/notes.md \
            artifacts/release-Linux-x64-gnu/* \
            artifacts/release-macOS-aarch64/* \
            artifacts/release-Windows-x64/*

  # RFC-061: repackage the Windows archive as an MSIX for the Microsoft Store.
  #
  # A sibling of `publish`, never a step inside `build`: both need only
  # `build`, so a failure here cannot stop a release from being published
  # (R6). The package is a workflow artifact and deliberately NOT attached to
  # the GitHub release - an unsigned MSIX is not installable, and the Store
  # signs what the owner submits, so no certificate or secret enters CI (R5,
  # R7). It also runs on workflow_dispatch, which is how it is verified
  # without cutting a release.
  #
  # PowerShell rather than the workflow's default bash: this job is all
  # Windows paths (`C:\Program Files (x86)\...` has spaces and parentheses)
  # and version comparison, which pwsh handles natively instead of through
  # Git Bash's path translation. Native commands are checked via
  # $LASTEXITCODE explicitly rather than trusting the shell to fail.
  msix:
    name: Windows MSIX package
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Repack exactly what was built and shipped, rather than rebuilding, so
      # the package holds byte-for-byte the binary users get; LICENSE and
      # NOTICE are already inside the archive.
      - name: Download the Windows archive
        uses: actions/download-artifact@v8
        with:
          name: release-Windows-x64
          path: archive

      # R1: makeappx.exe ships in the Windows SDK, but the runner image's
      # inventory does not name it, so it is located explicitly and the job
      # fails loudly, listing every path searched, if it is absent. No SDK is
      # installed here - if it is missing, that is a separate decision.
      - name: Locate makeappx.exe
        run: |
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
          $sdkPattern = Join-Path $kits 'bin\*\x64\makeappx.exe'
          $actPath = Join-Path $kits 'App Certification Kit\makeappx.exe'

          $sdkMatches = @(Get-ChildItem -Path $sdkPattern -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Parent.Name -match '^\d+(\.\d+){3}$' } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending)
          $actMatch = @(Get-Item -LiteralPath $actPath -ErrorAction SilentlyContinue)

          Write-Host "Searched:"
          Write-Host "  $sdkPattern"
          Write-Host "  $actPath"
          foreach ($m in $sdkMatches) { Write-Host "Found: $($m.FullName)" }
          foreach ($m in $actMatch) { Write-Host "Found: $($m.FullName)" }

          if ($sdkMatches.Count -gt 0) { $makeappx = $sdkMatches[0].FullName }
          elseif ($actMatch.Count -gt 0) { $makeappx = $actMatch[0].FullName }
          else {
            Write-Host "::error::makeappx.exe was not found in any searched location (listed above)"
            exit 1
          }
          Write-Host "Using: $makeappx"
          "MAKEAPPX=$makeappx" >> $env:GITHUB_ENV

      # R3: the version comes from Cargo.toml's workspace version - the one
      # place release prep bumps - never hand-maintained here, because a
      # version living in two places with one updated is what broke the 0.28.0
      # release. Partner Center reserves the fourth part, so it is always 0.
      - name: Read the crate version
        run: |
          $inSection = $false
          $crateVersion = $null
          foreach ($line in Get-Content Cargo.toml) {
            if ($line -match '^\s*\[(.+)\]\s*$') { $inSection = ($Matches[1] -eq 'workspace.package'); continue }
            if ($inSection -and $line -match '^\s*version\s*=\s*"([^"]+)"') { $crateVersion = $Matches[1]; break }
          }
          if (-not $crateVersion) {
            Write-Host "::error::no version found under [workspace.package] in Cargo.toml"
            exit 1
          }
          if ($crateVersion -notmatch '^\d+\.\d+\.\d+$') {
            Write-Host "::error::crate version '$crateVersion' is not plain x.y.z; an MSIX version is four numeric parts, so a pre-release cannot be packaged"
            exit 1
          }
          Write-Host "crate version $crateVersion -> MSIX version $crateVersion.0"
          "CRATE_VERSION=$crateVersion" >> $env:GITHUB_ENV
          "MSIX_VERSION=$crateVersion.0" >> $env:GITHUB_ENV

      # R2: the shipped files, plus the manifest at the root and Assets/
      # beside it. `7z` is already used by this workflow on Windows.
      - name: Stage the package directory
        run: |
          $zips = @(Get-ChildItem -Path archive -Filter *.zip)
          if ($zips.Count -ne 1) {
            Write-Host "::error::expected exactly one .zip in archive/, found $($zips.Count)"
            exit 1
          }
          New-Item -ItemType Directory -Path staging | Out-Null
          7z x $zips[0].FullName "-ostaging" -y
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Copy-Item packaging/windows/AppxManifest.xml staging/AppxManifest.xml
          Copy-Item -Recurse packaging/windows/Assets staging/Assets

          foreach ($required in 'knotra.exe', 'LICENSE', 'NOTICE', 'AppxManifest.xml') {
            if (-not (Test-Path -LiteralPath (Join-Path staging $required))) {
              Write-Host "::error::staging/$required is missing"
              exit 1
            }
          }
          Get-ChildItem staging -Recurse | ForEach-Object { Write-Host $_.FullName }

      # The substitution is anchored on the placeholder VALUE ("0.0.0.0", with
      # its quotes), not on `Version=`: the same file has MinVersion= and
      # MaxVersionTested= attributes, and a looser pattern would rewrite the
      # wrong one and produce a package that fails at submission, not here.
      # Only the staging copy is edited; the committed manifest is untouched.
      - name: Substitute the version into the staged manifest
        run: |
          $path = Join-Path (Resolve-Path staging).Path 'AppxManifest.xml'
          $xml = [System.IO.File]::ReadAllText($path)
          $placeholder = '"0.0.0.0"'
          $count = [regex]::Matches($xml, [regex]::Escape($placeholder)).Count
          if ($count -ne 1) {
            Write-Host "::error::expected exactly one $placeholder placeholder in the manifest, found $count"
            exit 1
          }
          $xml = $xml.Replace($placeholder, '"' + $env:MSIX_VERSION + '"')
          [System.IO.File]::WriteAllText($path, $xml, (New-Object System.Text.UTF8Encoding($false)))

          $actual = ([xml](Get-Content -Raw $path)).Package.Identity.Version
          if ($actual -ne $env:MSIX_VERSION) {
            Write-Host "::error::Identity Version is '$actual', expected '$env:MSIX_VERSION'"
            exit 1
          }
          Write-Host "Identity Version = $actual"

      # R4: no /nv. Semantic validation checks that every file the manifest
      # references is present in the package - the one defect this job could
      # otherwise ship silently, since a missing tile asset is invisible until
      # Partner Center rejects the submission.
      - name: Pack the MSIX
        run: |
          New-Item -ItemType Directory -Path out | Out-Null
          $staging = (Resolve-Path staging).Path
          $msix = Join-Path (Resolve-Path out).Path "knotra-$env:CRATE_VERSION.msix"
          & $env:MAKEAPPX pack /d $staging /p $msix
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "Packed: $msix ($((Get-Item $msix).Length) bytes)"
          "MSIX_PATH=$msix" >> $env:GITHUB_ENV

      # R3: nothing above may have rewritten the committed manifest.
      - name: Confirm the committed manifest is unchanged
        run: |
          git diff --exit-code -- packaging/windows
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # R5: an artifact, not a release asset.
      - name: Upload the MSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-Windows-msix
          path: ${{ env.MSIX_PATH }}
          if-no-files-found: error
