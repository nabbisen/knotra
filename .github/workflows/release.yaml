name: Release

# Pushing a version tag produces the whole release. `notes` first checks
# that the tag matches the crates' version, so a mistagged commit publishes
# nothing anywhere (RFC-063 A1); it then extracts the notes while
# `advisories` runs in parallel. Every platform is built and archived, and
# only once all three have succeeded does `publish` create the GitHub
# Release with all three archives attached at once - a platform failure
# means no release at all, rather than a partial one missing a binary
# (RFC-060 D4). After it, `crates` publishes the three crates to crates.io
# (RFC-063). Beside it, `msix` builds the Microsoft Store package as a
# workflow artifact (RFC-061).

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  # A dispatched run exercises notes, advisories, and build - producing
  # downloadable artifacts - and skips publish, so the whole flow can be
  # verified without creating a public release.
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  BIN_NAME: knotra
  # Matches the toolchain the project's gates are pinned to.
  TOOLCHAIN: "1.91"

jobs:
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # RFC-063 D3 (Amendment A1): the toolchain is needed only for the
      # version guard's `cargo metadata` call below — `notes` otherwise never
      # touches cargo. It lives here rather than in `crates` because `notes`
      # is on the critical path for every push-triggered job (`build` needs
      # it, `publish` needs `build`, `crates` needs `publish`), so a bad tag
      # fails here, before any later job — including `crates` — ever starts.
      - name: Install Rust toolchain
        if: github.event_name == 'push'
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal

      # Every job that publishes - the GitHub release, crates.io - runs
      # downstream of this step, so the tag must agree, exactly, with every
      # version the crates themselves carry: both Cargo.toml's own
      # [workspace.package] version and what `cargo metadata` resolves for
      # each of the three published crates. A mismatch here — a hand-typed
      # tag, a release-prep step that bumped one but not the other — is
      # exactly the class of error this exists to catch, loudly, before
      # anything is published. crates.io makes it matter most: an upload
      # there can never be undone.
      - name: Check the tag matches the crate version (RFC-063 A1)
        if: github.event_name == 'push'
        run: |
          TAG="$GITHUB_REF_NAME"
          mismatch=0

          TOML_VERSION=""
          in_section=0
          while IFS= read -r line; do
            if [[ "$line" =~ ^\[(.+)\]$ ]]; then
              if [ "${BASH_REMATCH[1]}" = "workspace.package" ]; then in_section=1; else in_section=0; fi
              continue
            fi
            if [ "$in_section" -eq 1 ] && [[ "$line" =~ ^[[:space:]]*version[[:space:]]*=[[:space:]]*\"([^\"]+)\" ]]; then
              TOML_VERSION="${BASH_REMATCH[1]}"
              break
            fi
          done < Cargo.toml

          if [ "$TOML_VERSION" != "$TAG" ]; then
            echo "::error::tag '$TAG' does not match Cargo.toml [workspace.package] version '$TOML_VERSION'"
            mismatch=1
          fi

          for crate in knotra knotra-ui knotra-vcs; do
            CRATE_VERSION=$(cargo "+$TOOLCHAIN" metadata --no-deps --format-version 1 \
              | jq -r --arg name "$crate" '.packages[] | select(.name == $name) | .version')
            if [ "$CRATE_VERSION" != "$TAG" ]; then
              echo "::error::tag '$TAG' does not match ${crate}'s cargo metadata version '$CRATE_VERSION'"
              mismatch=1
            fi
          done

          [ "$mismatch" -eq 0 ]

      # The release notes are the CHANGELOG section for this exact version,
      # so the published notes and the changelog cannot drift apart. A tag
      # with no matching section fails here rather than publishing an empty
      # release - that strictness stays on a real push, unconditionally.
      #
      # On workflow_dispatch there is no tag to match, and GITHUB_REF_NAME is
      # just the branch name - using it here would extract nothing, so build
      # would never run and the dry run would verify nothing it exists to
      # verify (Review 201 F1). Instead, a dispatched run uses the newest
      # released `## [x.y.z]` section, so notes/build/upload all exercise
      # real content without needing a tag.
      - name: Extract release notes from CHANGELOG
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG=$(grep -m1 -E '^## \[[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed -E 's/^## \[([^]]+)\].*/\1/')
            if [ -z "$TAG" ]; then
              echo "::error::CHANGELOG.md has no released '## [x.y.z]' section for a dry run"
              exit 1
            fi
            echo "workflow_dispatch: using newest released section '$TAG' for a dry run"
          else
            TAG="$GITHUB_REF_NAME"
          fi

          awk -v tag="$TAG" '
            index($0, "## [" tag "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$TAG]' section"
            exit 1
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes.md

  advisories:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Mirrors advisories.yaml's own gate exactly: checkout, presence check,
      # toolchain, cargo-deny cache/install, scan (RFC-060 D2). Duplicated
      # rather than shared as a reusable workflow (RFC-060 non-goal) - Review
      # 201 F2 is what happens when only one copy is updated, so change both
      # together whenever either changes.
      - name: Check deny.toml declares every advisory class
        run: |
          missing=0
          for key in yanked unmaintained unsound unused-ignored-advisory; do
            grep -Eq "^[[:space:]]*${key}[[:space:]]*=" deny.toml || { echo "::error::deny.toml is missing [advisories] ${key}"; missing=1; }
          done
          [ "$missing" -eq 0 ]

      # The runner's default rustup toolchain is stable, and rustup does not
      # auto-install a toolchain named with `+`; without this, the scan step
      # below fails before it ever reaches cargo-deny.
      - name: Install Rust toolchain
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal

      - name: Cache cargo-deny
        id: cache-cargo-deny
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}

      - name: Install cargo-deny
        if: steps.cache-cargo-deny.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny --version 0.20.2

      - name: Check advisories
        run: cargo +1.91 deny --manifest-path Cargo.toml check advisories

  build:
    name: ${{ matrix.name }}
    needs: [notes, advisories]
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the others work.
      fail-fast: false
      matrix:
        include:
          - name: Linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_ext: ""
            archive_ext: .tar.gz
          - name: macOS-aarch64
            target: aarch64-apple-darwin
            os: macos-latest
            bin_ext: ""
            archive_ext: .zip
          - name: Windows-x64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_ext: .exe
            archive_ext: .zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # knotra is an iced/wgpu GUI application; on Linux it needs Wayland,
      # xkbcommon, and GL headers present at build time.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup target add ${{ matrix.target }} --toolchain "$TOOLCHAIN"

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-

      - name: Build release binary
        run: |
          cargo "+$TOOLCHAIN" build \
            --release \
            --locked \
            --target ${{ matrix.target }} \
            --bin "$BIN_NAME"

      # Files are staged flat and archived from inside `dist`, so they unpack
      # straight into the extraction destination with no intermediate parent
      # directory — the same rule the source tarball follows. LICENSE and
      # NOTICE ship with the binary, as Apache-2.0 section 4 requires.
      - name: Stage archive contents
        run: |
          ASSET="${BIN_NAME}@${{ matrix.name }}-${GITHUB_REF_NAME}${{ matrix.archive_ext }}"
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.bin_ext }}" dist/
          cp LICENSE NOTICE README.md dist/

      - name: Create archive (tar.gz)
        if: matrix.archive_ext == '.tar.gz'
        run: tar czf "${ASSET}" -C dist .

      - name: Create archive (zip)
        if: matrix.archive_ext == '.zip'
        run: |
          cd dist
          7z a "../${ASSET}" .

      # No release upload here — `publish` attaches all three archives at
      # once, only after every platform has built (RFC-060 D4).
      - name: Upload archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: ${{ env.ASSET }}

  # Recovery: a transient failure (a flaky runner, a network blip) is
  # cleared by re-running only the failed jobs from the Actions UI;
  # `publish` then proceeds against the same tag and the same build
  # outputs. A failure that needs a code fix needs a new tag — re-running
  # rebuilds the same commit, so it cannot pick up a fix that has not been
  # tagged yet. If `publish` itself fails after a fix is needed, the tag
  # already pushed points at a commit that will never produce a release —
  # delete that tag (`git push --delete origin <tag>` and locally) and push
  # a new one once the fix lands, rather than re-running or re-pushing the
  # same tag.
  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # A dispatched run (no tag) produces artifacts from notes/advisories/build
    # for inspection and stops here - it never creates a release. Only a real
    # tag push publishes.
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # This job has no `actions/checkout`, so `gh` has no git remote to read
      # the repository from — `GH_REPO` is what tells it instead (Review 202
      # F3). A checkout would also supply one, but cloning the repository
      # just to name it is the heavier fix.
      - name: Create the release with all archives attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file artifacts/release-notes/notes.md \
            artifacts/release-Linux-x64-gnu/* \
            artifacts/release-macOS-aarch64/* \
            artifacts/release-Windows-x64/*

  # RFC-061: repackage the Windows archive as an MSIX for the Microsoft Store.
  #
  # A sibling of `publish`, never a step inside `build`: both need only
  # `build`, so a failure here cannot stop a release from being published
  # (R6). The package is a workflow artifact and deliberately NOT attached to
  # the GitHub release - an unsigned MSIX is not installable, and the Store
  # signs what the owner submits, so no certificate or secret enters CI (R5,
  # R7). It also runs on workflow_dispatch, which is how it is verified
  # without cutting a release.
  #
  # PowerShell rather than the workflow's default bash: this job is all
  # Windows paths (`C:\Program Files (x86)\...` has spaces and parentheses)
  # and version comparison, which pwsh handles natively instead of through
  # Git Bash's path translation. Native commands are checked via
  # $LASTEXITCODE explicitly rather than trusting the shell to fail.
  msix:
    name: Windows MSIX package
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Repack exactly what was built and shipped, rather than rebuilding, so
      # the package holds byte-for-byte the binary users get; LICENSE and
      # NOTICE are already inside the archive.
      - name: Download the Windows archive
        uses: actions/download-artifact@v8
        with:
          name: release-Windows-x64
          path: archive

      # R1: makeappx.exe ships in the Windows SDK, but the runner image's
      # inventory does not name it, so it is located explicitly and the job
      # fails loudly, listing every path searched, if it is absent. No SDK is
      # installed here - if it is missing, that is a separate decision.
      - name: Locate makeappx.exe
        run: |
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
          $sdkPattern = Join-Path $kits 'bin\*\x64\makeappx.exe'
          $actPath = Join-Path $kits 'App Certification Kit\makeappx.exe'

          $sdkMatches = @(Get-ChildItem -Path $sdkPattern -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Parent.Name -match '^\d+(\.\d+){3}$' } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending)
          $actMatch = @(Get-Item -LiteralPath $actPath -ErrorAction SilentlyContinue)

          Write-Host "Searched:"
          Write-Host "  $sdkPattern"
          Write-Host "  $actPath"
          foreach ($m in $sdkMatches) { Write-Host "Found: $($m.FullName)" }
          foreach ($m in $actMatch) { Write-Host "Found: $($m.FullName)" }

          if ($sdkMatches.Count -gt 0) { $makeappx = $sdkMatches[0].FullName }
          elseif ($actMatch.Count -gt 0) { $makeappx = $actMatch[0].FullName }
          else {
            Write-Host "::error::makeappx.exe was not found in any searched location (listed above)"
            exit 1
          }
          Write-Host "Using: $makeappx"
          "MAKEAPPX=$makeappx" >> $env:GITHUB_ENV

      # R3: the version comes from Cargo.toml's workspace version - the one
      # place release prep bumps. packaging/windows/AppxManifest.xml carries
      # the same version, committed, not substituted at package time any
      # more - kept in step by tests/store_manifest_version.rs, and checked
      # again by the step right after this one (RFC-064).
      - name: Read the crate version
        run: |
          $inSection = $false
          $crateVersion = $null
          foreach ($line in Get-Content Cargo.toml) {
            if ($line -match '^\s*\[(.+)\]\s*$') { $inSection = ($Matches[1] -eq 'workspace.package'); continue }
            if ($inSection -and $line -match '^\s*version\s*=\s*"([^"]+)"') { $crateVersion = $Matches[1]; break }
          }
          if (-not $crateVersion) {
            Write-Host "::error::no version found under [workspace.package] in Cargo.toml"
            exit 1
          }
          if ($crateVersion -notmatch '^\d+\.\d+\.\d+$') {
            Write-Host "::error::crate version '$crateVersion' is not plain x.y.z; an MSIX version is four numeric parts, so a pre-release cannot be packaged"
            exit 1
          }
          Write-Host "crate version $crateVersion -> MSIX version $crateVersion.0"
          "CRATE_VERSION=$crateVersion" >> $env:GITHUB_ENV
          "MSIX_VERSION=$crateVersion.0" >> $env:GITHUB_ENV

      # RFC-064: belt and suspenders on the one thing packaging cannot
      # excuse. tests/store_manifest_version.rs already fails a local gate
      # if the committed manifest and the crate disagree; this is the same
      # check, re-run against this job's own checkout, right before the
      # manifest is copied into the package. Writes nothing - the manifest
      # is no longer edited at any point in this job.
      - name: Verify the manifest's version matches the crate
        run: |
          $xml = [xml](Get-Content -Raw packaging/windows/AppxManifest.xml)
          $manifestVersion = $xml.Package.Identity.Version
          if ($manifestVersion -ne $env:MSIX_VERSION) {
            Write-Host "::error::packaging/windows/AppxManifest.xml Identity Version is '$manifestVersion', expected '$env:MSIX_VERSION' (from Cargo.toml)"
            exit 1
          }
          Write-Host "Verified: AppxManifest.xml Identity Version = $manifestVersion"

      # R2: the shipped files, plus the manifest at the root and Assets/
      # beside it. `7z` is already used by this workflow on Windows.
      - name: Stage the package directory
        run: |
          $zips = @(Get-ChildItem -Path archive -Filter *.zip)
          if ($zips.Count -ne 1) {
            Write-Host "::error::expected exactly one .zip in archive/, found $($zips.Count)"
            exit 1
          }
          New-Item -ItemType Directory -Path staging | Out-Null
          7z x $zips[0].FullName "-ostaging" -y
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Copy-Item packaging/windows/AppxManifest.xml staging/AppxManifest.xml
          Copy-Item -Recurse packaging/windows/Assets staging/Assets

          foreach ($required in 'knotra.exe', 'LICENSE', 'NOTICE', 'AppxManifest.xml') {
            if (-not (Test-Path -LiteralPath (Join-Path staging $required))) {
              Write-Host "::error::staging/$required is missing"
              exit 1
            }
          }
          Get-ChildItem staging -Recurse | ForEach-Object { Write-Host $_.FullName }

      # R4: no /nv. Semantic validation checks that every file the manifest
      # references is present in the package - the one defect this job could
      # otherwise ship silently, since a missing tile asset is invisible until
      # Partner Center rejects the submission.
      - name: Pack the MSIX
        run: |
          New-Item -ItemType Directory -Path out | Out-Null
          $staging = (Resolve-Path staging).Path
          $msix = Join-Path (Resolve-Path out).Path "knotra-$env:CRATE_VERSION.msix"
          & $env:MAKEAPPX pack /d $staging /p $msix
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "Packed: $msix ($((Get-Item $msix).Length) bytes)"
          "MSIX_PATH=$msix" >> $env:GITHUB_ENV

      # R5: an artifact, not a release asset.
      - name: Upload the MSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-Windows-msix
          path: ${{ env.MSIX_PATH }}
          if-no-files-found: error

  # RFC-063: the one real crates.io upload this workflow ever performs,
  # gated behind everything else succeeding first.
  #
  # `needs: publish` rather than `needs: build`: crates.io is the one
  # irreversible side effect anywhere in this pipeline (a version can be
  # yanked, never deleted or reused), so it runs only once the GitHub
  # release itself exists — never ahead of it, alongside it, or if any
  # platform failed to build.
  #
  # The version guard that must pass before this job can do anything lives
  # in `notes` (Amendment A1), not here: `notes` sits on the critical path
  # for every push-triggered job, so a mismatched tag fails loudly there,
  # before `crates` even starts, let alone authenticates.
  #
  # `environment: crates-io` is what each crate's crates.io trusted
  # publisher is keyed to (owner `nabbisen`, repository `knotra`, this exact
  # workflow filename, this exact environment name) — renaming either breaks
  # publishing. A job-level `permissions:` block REPLACES the workflow's
  # default rather than adding to it, so `contents: read` is listed
  # explicitly alongside `id-token: write`: without it, checkout fails.
  #
  # Published in dependency order — knotra-ui, knotra-vcs, knotra — so a
  # fresh `cargo publish` of knotra can always resolve its two siblings from
  # crates.io; cargo itself waits for each upload to appear in the index
  # before returning, so no extra synchronization is needed between the
  # three.
  #
  # Each crate is checked against the sparse index first and skipped if its
  # exact version is already there, so a re-run after a partial failure
  # (say, knotra-ui published but knotra-vcs's step then failed) picks up
  # where the previous run left off, rather than re-attempting a publish
  # that would fail anyway — crates.io versions can never be overwritten.
  crates:
    name: Publish to crates.io
    needs: publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev

      # cargo publish verifies each crate by building it, so it needs the
      # same toolchain and system libraries `build` does.
      - name: Install Rust toolchain
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal

      # Runs only after the guard in `notes` has already passed — this job
      # `needs: publish`, which transitively needs `notes` — so a mismatched
      # tag can never reach this step, let alone obtain a token.
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # The sparse index serves one JSON object per published version, one
      # per line, matched here on the parsed "vers" field only — never a
      # substring, so "0.30.0" cannot be satisfied by "0.30.0-rc.1" or
      # "10.30.0". A crate with no published versions at all answers 404 at
      # this URL; that is not an error, it is what "nothing of this crate
      # has ever reached crates.io" looks like over the sparse protocol, and
      # is treated as absent accordingly. Any other failure — a network
      # error, a 5xx, an unexpected status — fails the job outright:
      # "could not check" is never treated as "absent".
      - name: Publish each crate not already on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          for crate in knotra-ui knotra-vcs knotra; do
            prefix="${crate:0:2}/${crate:2:2}"
            url="https://index.crates.io/${prefix}/${crate}"

            # `&& curl_exit=0 || curl_exit=$?` rather than a plain `curl_exit=$?`
            # on the next line: this step runs under bash's default `-e`, so a
            # bare failing assignment would abort the step right here, skipping
            # the check below entirely — it would still fail the job, but
            # silently, without the message that says why. The `||` makes this
            # one conditional construct, which `-e` does not abort on, so the
            # check after it actually runs.
            response=$(curl -sS -H "User-Agent: knotra-release-workflow (https://github.com/nabbisen/knotra)" \
              -w $'\n%{http_code}' "$url") && curl_exit=0 || curl_exit=$?
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')

            if [ "$curl_exit" -ne 0 ]; then
              echo "::error::network error reaching the crates.io sparse index for $crate ($url, curl exit $curl_exit) - refusing to treat this as absent"
              exit 1
            fi

            case "$http_code" in
              200)
                if echo "$body" | jq -r '.vers' | grep -Fxq "$GITHUB_REF_NAME"; then
                  present=1
                else
                  present=0
                fi
                ;;
              404)
                # No version of this crate has ever been published.
                present=0
                ;;
              *)
                echo "::error::unexpected HTTP $http_code from the crates.io sparse index for $crate ($url) - refusing to treat this as absent"
                exit 1
                ;;
            esac

            if [ "$present" -eq 1 ]; then
              echo "::notice::$crate $GITHUB_REF_NAME is already on crates.io, skipping"
            else
              echo "Publishing $crate $GITHUB_REF_NAME..."
              cargo "+$TOOLCHAIN" publish -p "$crate" --locked
            fi
          done

  # RFC-063 D5: exercises the real `cargo publish` machinery — packaging,
  # manifest verification, building each crate — without ever uploading.
  # No `id-token` permission and no `environment`: this job never
  # authenticates and never could, which is the point — it proves the
  # publish step itself is sound between releases, with no access to any
  # crates.io token. Runs only on workflow_dispatch, in parallel with
  # `build` (no `needs:`): it shares no state with the rest of the pipeline.
  crates-dry-run:
    name: Publish to crates.io (dry run)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal

      # Task 090: `cargo publish --workspace --dry-run` verifies each crate
      # against crates.io plus the workspace's own packages, and a published
      # version that satisfies a sibling's version requirement is preferred
      # over the workspace's own package. Between releases the workspace
      # version *is* the published one, so a crate that uses a sibling's new
      # API fails to verify even though nothing is wrong — a version above
      # every published one, and never itself published, is the only one
      # that verifies the workspace as it actually stands. Rewrites the
      # version in this job's own checkout only; nothing here is committed
      # or pushed, and the `crates` job (the real publish, on a tag) needs
      # none of this — release prep has already bumped the version there,
      # and `notes`'s guard checks the tag against it.
      - name: Set the workspace version above anything published
        run: |
          OLD_VERSION=""
          in_section=0
          while IFS= read -r line; do
            if [[ "$line" =~ ^\[(.+)\]$ ]]; then
              if [ "${BASH_REMATCH[1]}" = "workspace.package" ]; then in_section=1; else in_section=0; fi
              continue
            fi
            if [ "$in_section" -eq 1 ] && [[ "$line" =~ ^[[:space:]]*version[[:space:]]*=[[:space:]]*\"([^\"]+)\" ]]; then
              OLD_VERSION="${BASH_REMATCH[1]}"
              break
            fi
          done < Cargo.toml

          if [ -z "$OLD_VERSION" ]; then
            echo "::error::no version found under [workspace.package] in Cargo.toml"
            exit 1
          fi

          CORE="${OLD_VERSION%%[-+]*}"
          MAJOR="${CORE%%.*}"
          REST="${CORE#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))-dryrun"

          sed -i -E "s/^version = \"${OLD_VERSION}\"\$/version = \"${NEW_VERSION}\"/" Cargo.toml
          sed -i -E "s/^(knotra-ui +)= \{ version = \"${OLD_VERSION}\"/\1= { version = \"${NEW_VERSION}\"/" Cargo.toml
          sed -i -E "s/^(knotra-vcs +)= \{ version = \"${OLD_VERSION}\"/\1= { version = \"${NEW_VERSION}\"/" Cargo.toml

          # Not `--offline`: a fresh runner has no registry cache, and
          # offline resolution then fails. `--workspace` still changes only
          # the three members' lockfile entries.
          cargo "+$TOOLCHAIN" update --workspace

          # A rewrite that matched nothing would leave the published version
          # in place and bring back the very failure this step exists to
          # avoid, so confirm every crate now carries the dry-run version.
          for crate in knotra knotra-ui knotra-vcs; do
            CRATE_VERSION=$(cargo "+$TOOLCHAIN" metadata --no-deps --format-version 1 \
              | jq -r --arg name "$crate" '.packages[] | select(.name == $name) | .version')
            if [ "$CRATE_VERSION" != "$NEW_VERSION" ]; then
              echo "::error::${crate} is at '$CRATE_VERSION', not the dry-run version '$NEW_VERSION'"
              exit 1
            fi
          done

          echo "crate version $OLD_VERSION -> dry-run version $NEW_VERSION"

      # `--allow-dirty`: the checkout is now modified, on purpose, by the
      # step above.
      - name: Dry-run publish the whole workspace
        run: cargo "+$TOOLCHAIN" publish --workspace --dry-run --locked --allow-dirty
