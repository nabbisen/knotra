name: Release

# Pushing a version tag produces the whole release: this creates the GitHub
# Release from the matching CHANGELOG section, then attaches a built
# executable for each supported platform.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  BIN_NAME: knotra
  # Matches the toolchain the project's gates are pinned to.
  TOOLCHAIN: "1.91"

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # The release notes are the CHANGELOG section for this exact version,
      # so the published notes and the changelog cannot drift apart. A tag
      # with no matching section fails here rather than publishing an empty
      # release.
      - name: Extract release notes from CHANGELOG
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            index($0, "## [" tag "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$GITHUB_REF_NAME]' section"
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md

  build:
    name: ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the others work.
      fail-fast: false
      matrix:
        include:
          - name: Linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_ext: ""
            archive_ext: .tar.gz
          - name: macOS-aarch64
            target: aarch64-apple-darwin
            os: macos-latest
            bin_ext: ""
            archive_ext: .zip
          - name: Windows-x64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_ext: .exe
            archive_ext: .zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # knotra is an iced/wgpu GUI application; on Linux it needs Wayland,
      # xkbcommon, and GL headers present at build time.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup target add ${{ matrix.target }} --toolchain "$TOOLCHAIN"

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-

      - name: Build release binary
        run: |
          cargo "+$TOOLCHAIN" build \
            --release \
            --locked \
            --target ${{ matrix.target }} \
            --bin "$BIN_NAME"

      # Files are staged flat and archived from inside `dist`, so they unpack
      # straight into the extraction destination with no intermediate parent
      # directory — the same rule the source tarball follows. LICENSE and
      # NOTICE ship with the binary, as Apache-2.0 section 4 requires.
      - name: Stage archive contents
        run: |
          ASSET="${BIN_NAME}@${{ matrix.name }}-${GITHUB_REF_NAME}${{ matrix.archive_ext }}"
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.bin_ext }}" dist/
          cp LICENSE NOTICE README.md dist/

      - name: Create archive (tar.gz)
        if: matrix.archive_ext == '.tar.gz'
        run: tar czf "${ASSET}" -C dist .

      - name: Create archive (zip)
        if: matrix.archive_ext == '.zip'
        run: |
          cd dist
          7z a "../${ASSET}" .

      - name: Attach archive to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "${ASSET}"
