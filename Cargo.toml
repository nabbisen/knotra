[workspace]
resolver = "3"
members = [
    "crates/knotra-vcs",
    "crates/knotra-ui",
    "crates/knotra-app",
]

[workspace.package]
version = "0.28.0"
edition         = "2024"
rust-version    = "1.88"
license         = "Apache-2.0"
authors         = ["nabbisen"]
categories      = ["development-tools"]
keywords        = ["git", "jj"]
repository      = "https://github.com/nabbisen/knotra"

[workspace.dependencies]
knotra-ui                   = { version = "0.28.0", path = "crates/knotra-ui" }
knotra-vcs                  = { version = "0.28.0", path = "crates/knotra-vcs" }

endringer-async             = "0.33"
endringer-core              = "0.33"
endringer-git               = "0.33"
endringer-jj                = "0.33"

iced                        = { version = "0.14", features = ["tokio", "image", "svg", "advanced"] }
snora                       = { version = "0.38", features = ["design", "lucide-icons"] }

chrono                      = { version = "0.4", features = ["serde"] }
dirs                        = "5"
rfd                         = { version = "0.15", default-features = false, features = ["tokio", "xdg-portal"] }

anyhow                      = "1"
tokio                       = { version = "1", features = ["full"] }
serde                       = { version = "1", features = ["derive"] }
serde_json                  = "1"
thiserror                   = "2"
toml                        = "0.8"
tracing                     = "0.1"
tracing-subscriber          = { version = "0.3", features = ["env-filter"] }
uuid                        = { version = "1", features = ["v4", "serde"] }

# Testing
filetime                    = "0.2"
tempfile                    = "3"
