[package]
name        = "knotra"
description = "knotra: multi-project VCS dashboard and bulk-operation tool."
readme      = "../../README.md"
version.workspace       = true
edition.workspace       = true
rust-version.workspace = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true
keywords.workspace      = true
categories.workspace    = true

# Checks the repository's Store manifest and Linux metainfo, neither of
# which is part of this crate.
exclude = ["tests/store_manifest_version.rs", "tests/metainfo_version.rs"]

[[bin]]
name    = "knotra"
path    = "src/main.rs"

[dependencies]
knotra-ui                   = { workspace = true }
knotra-vcs                  = { workspace = true }

iced                        = { workspace = true }
snora                       = { workspace = true }

chrono                      = { workspace = true }
dirs                        = { workspace = true }
rfd                         = { workspace = true }

anyhow                      = { workspace = true }
tokio                       = { workspace = true }
serde                       = { workspace = true }
serde_json                  = { workspace = true }
thiserror                   = { workspace = true }
toml                        = { workspace = true }
tracing                     = { workspace = true }
tracing-subscriber          = { workspace = true }
uuid                        = { workspace = true }

[dev-dependencies]
tempfile                    = { workspace = true }
iced_test                   = { workspace = true }
# Task 110 §3: decodes the PNG `Snapshot::matches_image` writes, to read
# back a pixel's colour directly — `Snapshot` exposes no in-memory
# accessor of its own, only file-comparison methods. The same version
# `iced_test` itself already resolves to (Cargo.lock), so this adds no
# second copy to the dependency graph.
png                          = { workspace = true }
